<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ran - Nuestra Historia</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080706; 
            /* Cambiado a un tono crema/oro suave */
            --gold-light: rgba(236, 220, 180, 0.15); 
            --gold-solid: #c5a880;
            --yellow-glow: #e9d1a9; /* Un color champán más armónico */
            --text-high: #e0d8d0;
            --text-mid: rgba(224, 216, 208, 0.5);
            --text-low: rgba(224, 216, 208, 0.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-high);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .background-aura {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, var(--gold-light) 0%, transparent 75%);
            z-index: -1;
            pointer-events: none;
        }

        .spacer { height: 100vh; }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 25px;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        section.visible { opacity: 1; }

        h1, h2, .serif { font-family: 'Playfair Display', serif; }
        .italic { font-style: italic; }
        .caps-label { 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            font-size: 0.65rem; 
            color: var(--text-low); 
            margin: 10px 0; 
        }

        /* --- CUADROS CON BRILLO SUAVIZADO --- */
        .glow-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(197, 168, 128, 0.15);
            padding: 40px 30px;
            border-radius: 15px;
            transition: all 0.5s ease;
            cursor: pointer;
            width: 85vw;
            max-width: 320px;
            margin: 0 auto;
        }
        .glow-card:active {
            /* Brillo más sutil y elegante */
            box-shadow: 0 0 30px rgba(233, 209, 169, 0.25);
            background: rgba(233, 209, 169, 0.05);
            border-color: var(--yellow-glow);
            transform: scale(0.98);
        }

        /* --- SLIDER HORIZONTAL --- */
        .horizontal-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100vw;
            padding-bottom: 50px;
            scrollbar-width: none;
        }
        .horizontal-slider::-webkit-scrollbar { display: none; }
        
        .slide-item {
            flex: 0 0 100vw;
            scroll-snap-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- PROMESAS 3D --- */
        .promise-card { width: 300px; height: 420px; perspective: 1000px; }
        .promise-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .promise-card.flipped .promise-inner { transform: rotateY(180deg); }

            backface-visibility: hidden; display: flex; flex-direction: column;
